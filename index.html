<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>OSD app has moved</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #111827; color: #f9fafb;
         display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .box { max-width: 360px; text-align: center; line-height: 1.45; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { margin: 0 0 14px; color: #d1d5db; font-size: 15px; }
  a.btn { display: block; padding: 14px; border-radius: 10px; background: #2563eb; color: #fff; font-weight: 600; text-decoration: none; font-size: 16px; }
</style>
</head>
<body>
<div class="box">
  <h1>The OSD app has moved</h1>
  <p id="msg">Opening the new address...</p>
  <a class="btn" id="go" href="https://base-commish.github.io/OSD/">Open the OSD app</a>
</div>
<script>
// Nov 27, 2026: the OSD app moved to https://base-commish.github.io/OSD/. This old page only forwards, carrying this phone's saved
// sign-ins after the # (never sent to a server) so nobody has to sign in again. It also tells the league's
// script which team still uses the old address (fw_Forward.js), so we know when it's safe to turn this page off.
(function () {
  var NEW = 'https://base-commish.github.io/OSD/';
  var EXEC = 'https://script.google.com/macros/s/AKfycbybVH34wHTo9tWdG7AzCcUoZ50h3We47tEv_If1r4LXavSpTn7NXM5H5ZaYdLyaV_Q5wg/exec';
  var ME = 'osd';
  var q = new URLSearchParams(location.search);
  var d = {};
  ['lbl', 'osd'].forEach(function (lg) {
    ['_session', '_team', '_key'].forEach(function (x) {
      try { var v = localStorage.getItem(lg + x); if (v) d[lg + x] = v; } catch (e) {}
    });
  });
  var team = String(q.get('t') || d[ME + '_team'] || '').toUpperCase();
  if (team) { try { new Image().src = EXEC + '?fw=1&t=' + encodeURIComponent(team); } catch (e) {} }
  var url = NEW + location.search + '#from-old=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(d)))));
  document.getElementById('go').href = url;
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (standalone) {
    // Opened from a home-screen icon: say so once, and let the tap do the jump.
    document.getElementById('msg').textContent = 'Tap below to open it, then add it to your home screen and delete this old icon. You\'ll stay signed in.';
  } else {
    setTimeout(function () { location.replace(url); }, 600);
  }
})();
</script>
</body>
</html>
